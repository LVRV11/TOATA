<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>The Art of Touch Academy</title>
<meta name="description" content="TOTA, The Art of Touch Academy: online massage education. Browse courses in relaxation, deep tissue, sports and facial massage and professional development.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: calm editorial flow. Arch-shaped image frames are the one recurring motif; the philosophy band is the single bold typographic moment. */
:root{
  --ivory:#F7F4EE;--sand:#E9E0D4;--beige:#D8C8B6;--sage:#A6B09A;--olive:#747C65;--brown:#655346;--charcoal:#34332F;
  --bg:#F7F4EE;--bg-alt:#E9E0D4;--surface:#FCFAF6;--fg:#34332F;--fg-soft:#655346;--line:#D8C8B6;
  --accent:#5A624E;--accent-ink:#F7F4EE;--btn-hover:#34332F;
  --band:#34332F;--band-fg:#F7F4EE;--band-soft:#D8C8B6;
  --art-a:#EFE8DC;--art-b:#D8C8B6;--art-sun:#F7F4EE;--art-1:#747C65;--art-2:#A6B09A;--art-3:#655346;--art-4:#F7F4EE;
  --serif:"Cormorant Garamond","Playfair Display",Georgia,serif;
  --sans:"Manrope",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#23221F;--bg-alt:#2B2A26;--surface:#302F2A;--fg:#F2EDE4;--fg-soft:#CBBFAE;--line:#46433C;
  --accent:#A6B09A;--accent-ink:#23221F;--btn-hover:#D9E0CE;
  --band:#1B1A18;--band-fg:#F2EDE4;--band-soft:#CBBFAE;
  --art-a:#3A382F;--art-b:#4B463B;--art-sun:#5A5546;--art-1:#A6B09A;--art-2:#747C65;--art-3:#D8C8B6;--art-4:#6A6354;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#23221F;--bg-alt:#2B2A26;--surface:#302F2A;--fg:#F2EDE4;--fg-soft:#CBBFAE;--line:#46433C;
  --accent:#A6B09A;--accent-ink:#23221F;--btn-hover:#D9E0CE;
  --band:#1B1A18;--band-fg:#F2EDE4;--band-soft:#CBBFAE;
  --art-a:#3A382F;--art-b:#4B463B;--art-sun:#5A5546;--art-1:#A6B09A;--art-2:#747C65;--art-3:#D8C8B6;--art-4:#6A6354;color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1rem/1.7 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
img,svg{max-width:100%}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:clamp(3rem,7.4vw,6.2rem);line-height:.98}
h2{font-size:clamp(2.1rem,4.4vw,3.5rem)}
h3{font-size:clamp(1.45rem,2.2vw,1.8rem)}
h1 em,h2 em{font-style:italic;font-weight:400;color:var(--accent)}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
main:focus{outline:none}
.wrap{width:100%;max-width:1240px;margin-inline:auto;padding-left:max(clamp(16px,4vw,48px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,4vw,48px),env(safe-area-inset-right,0px))}
.sec{padding-block:clamp(56px,9vw,120px)}
.sec.alt{background:var(--bg-alt)}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--accent)}
.lead{font-size:clamp(1.05rem,1.6vw,1.25rem);color:var(--fg-soft);max-width:34rem}
.soft{color:var(--fg-soft)}
.prose{display:grid;gap:1.1rem;max-width:62ch}
.sh{display:grid;gap:.9rem;max-width:44rem;margin-bottom:clamp(28px,5vw,56px)}
.sh-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:20px;margin-bottom:clamp(28px,5vw,56px)}
.sh-row .sh{margin:0}
.skip{position:absolute;left:16px;top:-80px;z-index:50;background:var(--accent);color:var(--accent-ink);border:0;padding:.7rem 1rem;font:600 .85rem var(--sans);border-radius:999px;cursor:pointer}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 8px)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.7rem;padding:1rem 1.7rem;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:600 .76rem/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;border-radius:999px;cursor:pointer;transition:background .25s,color .25s,border-color .25s}
.btn span{transition:transform .25s}
.btn:hover{background:var(--btn-hover);border-color:var(--btn-hover)}
.btn:hover span{transform:translateX(4px)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--fg-soft)}
.btn.ghost:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.lg{padding:1.2rem 2rem;font-size:.8rem;width:100%}
.btn.disabled{background:transparent;color:var(--fg-soft);border-color:var(--line);cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.link{font-size:.76rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid var(--accent);padding-bottom:4px;color:var(--accent)}
.link:hover{color:var(--fg);border-color:var(--fg)}

/* header */
.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:76px}
.logo{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--fg)}
.logo svg{width:46px;height:auto;flex:none;color:var(--accent)}
.logo-t{display:grid;line-height:1.15}
.logo-t b{font:600 .86rem var(--sans);letter-spacing:.3em}
.logo-t i{font:500 .62rem var(--sans);font-style:normal;letter-spacing:.62em;color:var(--fg-soft)}
.nav{display:flex;gap:clamp(18px,3vw,40px);list-style:none;margin:0;padding:0}
.nav a{display:inline-block;padding:.5rem 0;font-size:.74rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;color:var(--fg-soft);border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.nav a:hover,.nav a[aria-current="page"]{color:var(--fg);border-color:var(--accent)}
.menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:.65rem 1.1rem;font:600 .72rem var(--sans);letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
@media (max-width:760px){
  .menu-btn{display:inline-block}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;gap:0;background:var(--bg);border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-left,0px)) 16px}
  .nav.open{display:flex}
  .nav a{display:block;padding:1rem 0;border-bottom:1px solid var(--line);width:100%}
  .logo svg{width:38px}
  .logo-t b{font-size:.74rem;letter-spacing:.24em}
  .logo-t i{font-size:.56rem}
}

/* generated art */
.art{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--art-a),var(--art-b))}
.art svg{position:absolute;inset:0;width:100%;height:100%;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art path{fill:none;stroke-width:1.1;vector-effect:non-scaling-stroke}
.art .a0{stroke:var(--art-1)}.art .a1{stroke:var(--art-2)}.art .a2{stroke:var(--art-3)}.art .a3{stroke:var(--art-4)}
.art circle{fill:var(--art-sun);opacity:.75}
.art[data-tone="sage"]{--art-a:#93A086;--art-b:#6F7863;--art-1:#F7F4EE;--art-2:#D8C8B6;--art-3:#4B5340;--art-4:#E9E0D4;--art-sun:#C9D1BD}
.art[data-tone="brown"]{--art-a:#7C6757;--art-b:#5B4A3E;--art-1:#D8C8B6;--art-2:#F7F4EE;--art-3:#A6B09A;--art-4:#8F7A68;--art-sun:#9A8573}
.art[data-tone="olive"]{--art-a:#8A9279;--art-b:#5F6753;--art-1:#E9E0D4;--art-2:#F7F4EE;--art-3:#A6B09A;--art-4:#747C65;--art-sun:#B5BDA5}
.arch{border-radius:999px 999px 6px 6px}
.ph{margin-top:10px;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-soft)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(28px,6vw,96px);align-items:center}
.hero-copy{display:grid;gap:clamp(18px,2.4vw,30px);justify-items:start}
.hero-art{margin:0}
.hero-art .art{aspect-ratio:4/5}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}.hero-art{max-width:420px}}

/* intro */
.two{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(28px,6vw,96px);align-items:start}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.pillars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 32px;margin-top:12px}
.pillars h3{font-size:1.5rem;margin-bottom:.4rem}
.pillars p{color:var(--fg-soft);font-size:.95rem}
.pillars div{border-top:1px solid var(--line);padding-top:16px}
@media (max-width:520px){.pillars{grid-template-columns:minmax(0,1fr)}}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(28px,3.4vw,48px) clamp(20px,3vw,40px)}
.card{display:flex;flex-direction:column;gap:18px;min-width:0}
.card-media{display:block;aspect-ratio:4/5;position:relative;border-radius:999px 999px 6px 6px}
.card:hover .card-media svg{transform:scale(1.05)}
.tag{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--bg);color:var(--fg-soft);font:600 .62rem var(--sans);letter-spacing:.18em;text-transform:uppercase;padding:.45rem .8rem;border-radius:999px;white-space:nowrap}
.card-body{display:flex;flex-direction:column;gap:12px;flex:1}
.meta{display:flex;flex-wrap:wrap;gap:.3rem .9rem;font-size:.68rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.meta span+span{color:var(--fg-soft)}
.card h3 a{text-decoration:none}
.card h3 a:hover{color:var(--accent)}
.card p.desc{color:var(--fg-soft);font-size:.95rem}
.card-foot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:1px solid var(--line);padding-top:14px;margin-top:auto;font-size:.82rem;color:var(--fg-soft)}
.price{font:500 1.7rem/1 var(--serif);color:var(--fg)}
.card .btn{align-self:flex-start}

/* philosophy band */
.band{background:var(--band);color:var(--band-fg)}
.band .eyebrow{color:var(--band-soft)}
.band .two{align-items:center}
.band p.lead{color:var(--band-soft)}
.motto{font:500 clamp(2.2rem,5.6vw,4.8rem)/1.02 var(--serif);letter-spacing:.01em;text-transform:uppercase;display:grid;gap:.15em}
.motto span:nth-child(2){font-style:italic;text-transform:none;font-weight:400;color:var(--band-soft)}

/* lists */
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:32px}
.why div{border-top:1px solid var(--fg-soft);padding-top:18px;display:grid;gap:10px;align-content:start}
.why p{color:var(--fg-soft);font-size:.95rem}
.tech{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.tech li{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:8px 32px;align-items:baseline;padding:22px 0;border-bottom:1px solid var(--line)}
.tech b{font:500 clamp(1.7rem,3vw,2.4rem)/1.1 var(--serif)}
.tech span{color:var(--fg-soft)}
@media (max-width:640px){.tech li{grid-template-columns:minmax(0,1fr)}}
.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:24px}
.quote{border:1px dashed var(--fg-soft);border-radius:6px;padding:28px;display:grid;gap:14px;align-content:start;background:var(--surface)}
.quote .tag{position:static;transform:none;justify-self:start;border:1px solid var(--line)}
.quote p{font:italic 400 1.35rem/1.4 var(--serif);color:var(--fg-soft)}
.quote small{font-size:.8rem;color:var(--fg-soft);letter-spacing:.06em}

/* faq */
.faq{max-width:52rem;border-bottom:1px solid var(--line)}
.faq details{border-top:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:20px;align-items:center;padding:22px 0;font:500 clamp(1.25rem,2vw,1.55rem)/1.25 var(--serif)}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font:300 1.8rem/1 var(--sans);color:var(--accent);transition:transform .25s;flex:none}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 0 24px;color:var(--fg-soft);max-width:60ch}

/* forms */
.form{display:grid;gap:18px}
.field{display:grid;gap:8px}
label{font-size:.7rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--fg-soft)}
input,textarea,select{width:100%;font:400 1rem var(--sans);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:.9rem 1rem;transition:border-color .2s}
input:hover,textarea:hover,select:hover{border-color:var(--fg-soft)}
textarea{min-height:150px;resize:vertical}
.status{font-size:.92rem;color:var(--fg-soft);min-height:1.4em}
.nl{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(28px,6vw,96px);align-items:center}
.nl .form{grid-template-columns:minmax(0,1fr) auto;align-items:end}
.nl .status{grid-column:1/-1}
@media (max-width:860px){.nl{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.nl .form{grid-template-columns:minmax(0,1fr)}}

/* course page */
.crumbs{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-soft);display:flex;flex-wrap:wrap;gap:8px}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--accent)}
.c-head{display:grid;gap:22px;padding-block:clamp(28px,5vw,56px) clamp(24px,4vw,40px);max-width:56rem}
.c-cover{aspect-ratio:21/9;border-radius:6px}
@media (max-width:640px){.c-cover{aspect-ratio:4/3}}
.c-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"main aside";gap:clamp(32px,6vw,96px);align-items:start;padding-block:clamp(36px,6vw,72px) clamp(56px,9vw,120px)}
.c-main{grid-area:main;display:grid;gap:clamp(40px,6vw,72px);min-width:0}
.c-aside{grid-area:aside;position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:28px;display:grid;gap:18px}
.c-aside dl{display:grid;gap:12px;margin:0;font-size:.9rem}
.c-aside dl div{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding-top:12px}
.c-aside dt{color:var(--fg-soft)}.c-aside dd{margin:0;text-align:right;font-weight:600}
.c-aside .price{font-size:2.6rem}
.note{font-size:.8rem;color:var(--fg-soft)}
@media (max-width:900px){.c-layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"aside" "main"}.c-aside{position:static}}
.c-sec{display:grid;gap:22px}
.c-sec h2{font-size:clamp(1.8rem,3.2vw,2.5rem)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.checks li{position:relative;padding-left:2rem}
.checks li::before{content:"";position:absolute;left:2px;top:.55em;width:.85rem;height:.45rem;border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg)}
.programme{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.programme li{display:grid;grid-template-columns:7rem minmax(0,1fr);gap:8px 24px;padding:22px 0;border-bottom:1px solid var(--line)}
.programme .mod{font-size:.7rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);padding-top:.5rem}
.programme h3{font-size:1.5rem;margin-bottom:.3rem}
.programme p{color:var(--fg-soft);font-size:.95rem}
@media (max-width:560px){.programme li{grid-template-columns:minmax(0,1fr)}}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:24px}
.facts div{border-top:1px solid var(--fg-soft);padding-top:14px;display:grid;gap:6px;align-content:start}
.facts h3{font:600 .7rem var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.facts ul{margin:0;padding-left:1.1rem;color:var(--fg-soft);font-size:.95rem}
.facts p{color:var(--fg-soft);font-size:.95rem}

/* catalogue */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:clamp(28px,4vw,48px)}
.chip{font:600 .72rem var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:.75rem 1.2rem;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--fg-soft);cursor:pointer;transition:all .2s}
.chip:hover{border-color:var(--fg-soft);color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.count{font-size:.85rem;color:var(--fg-soft);margin-bottom:24px}
.sample-note{border:1px dashed var(--fg-soft);border-radius:6px;padding:14px 18px;font-size:.88rem;color:var(--fg-soft);margin-bottom:32px;max-width:52rem}

/* contact */
.contact{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(32px,6vw,96px);align-items:start}
@media (max-width:860px){.contact{grid-template-columns:minmax(0,1fr)}}
.copyrow{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.copyrow code{font:500 1.05rem var(--sans);user-select:all;word-break:break-all}
.social{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:12px 28px}

/* footer */
.foot-wrap{background:var(--band);color:var(--band-fg)}
.foot{display:grid;grid-template-columns:minmax(0,5fr) repeat(3,minmax(0,2fr));gap:40px;padding-block:clamp(48px,7vw,88px) 32px}
.foot h4{font:600 .7rem var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--band-soft);margin-bottom:16px}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:.92rem}
.foot a{text-decoration:none}.foot a:hover{text-decoration:underline;text-underline-offset:4px}
.foot-brand{display:grid;gap:14px;align-content:start}
.foot-tota{font:500 clamp(3rem,7vw,5rem)/1 var(--serif);letter-spacing:.14em}
.foot-name{font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--band-soft)}
.foot-brand p{color:var(--band-soft);max-width:30ch;font-size:.95rem}
.foot-base{border-top:1px solid color-mix(in srgb,var(--band-soft) 30%,transparent);padding-block:20px 28px;font-size:.78rem;color:var(--band-soft);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
@media (max-width:900px){.foot{grid-template-columns:repeat(2,minmax(0,1fr))}.foot-brand{grid-column:1/-1}}
@media (max-width:480px){.foot{grid-template-columns:minmax(0,1fr)}}

.legal{max-width:46rem;display:grid;gap:18px;padding-block:clamp(40px,7vw,96px)}
.legal ul{margin:0;padding-left:1.2rem;color:var(--fg-soft)}
.page-head{padding-block:clamp(40px,7vw,96px) clamp(24px,4vw,40px);display:grid;gap:20px;max-width:50rem}

main{animation:in .5s ease backwards}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>


</head>
<body>
<button class="skip" id="skip" type="button">Skip to content</button>
<header class="site">
  <div class="wrap bar">
    <a class="logo" href="#home" aria-label="The Art of Touch Academy, home">
      <svg viewBox="0 0 48 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M2 24C9 5 19 4 25 15s15 15 21-4"/><path d="M2 29C10 13 19 12 25 21s14 9 21-2" opacity=".55"/></svg>

<script>
(function(){
  var DATA = JSON.parse(document.getElementById('tota-data').textContent);

  var filter = 'All';

  function esc(s){return String(s == null ? '' : s).replace(/[&<>"']/g, function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
  function money(c){return c.price > 0 ? new Intl.NumberFormat('en',{style:'currency',currency:c.currency||'EUR',maximumFractionDigits:0}).format(c.price) : 'Free';}
  function safeUrl(u){return /^https:\/\//i.test(u || '') ? u : '';}
  function tone(c){if(c.tone) return c.tone; var i = Math.max(0, categories.indexOf(c.category)); return ['sand','sage','brown','olive'][i % 4];}

  /* generated flowing-line illustration, used until real photography is added */
  function rng(seed){var h=2166136261;for(var i=0;i<seed.length;i++){h^=seed.charCodeAt(i);h=Math.imul(h,16777619);}return function(){h+=0x6D2B79F5;var t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
  function artSvg(seed){
    var r = rng(seed), w = 800, h = 1000, n = 28, out = '';
    var phase = r()*6.28, amp = h*(0.045+r()*0.05), freq = 1.1+r()*1.3, tilt = (r()-0.5)*h*0.3;
    var sx = w*(0.25+r()*0.5), sy = h*(0.18+r()*0.25), sr = w*(0.1+r()*0.08);
    out += '<circle cx="'+sx.toFixed(0)+'" cy="'+sy.toFixed(0)+'" r="'+sr.toFixed(0)+'"/>';
    for(var i=0;i<n;i++){
      var t = i/(n-1), y0 = h*(0.1+0.8*t), pts = [];
      for(var k=0;k<=20;k++){var x = w*k/20; pts.push([x, y0 + Math.sin(x/w*freq*Math.PI*2+phase+t*2.6)*amp*(0.35+t*1.2) + (x/w-0.5)*tilt]);}
      var d = 'M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
      for(var j=1;j<pts.length-1;j++){d += 'Q'+pts[j][0].toFixed(1)+' '+pts[j][1].toFixed(1)+' '+((pts[j][0]+pts[j+1][0])/2).toFixed(1)+' '+((pts[j][1]+pts[j+1][1])/2).toFixed(1);}
      out += '<path class="a'+(i%4)+'" d="'+d+'" style="opacity:'+(0.25+0.6*Math.sin(t*Math.PI)).toFixed(2)+'"/>';
    }
    return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">'+out+'</svg>';
  }
  function artInner(src, seed, alt){return src ? '<img src="'+esc(src)+'" alt="'+esc(alt||'')+'" loading="lazy" decoding="async">' : artSvg(seed);}

  /* shared pieces */
  function card(c){

      '<div class="card-body">' +

  }

  function chips(){
    var used = categories.filter(function(c){return courses.some(function(x){return x.category === c;});});
    return ['All'].concat(used).map(function(c){return '<button type="button" class="chip" data-filter="'+esc(c)+'" aria-pressed="'+(c===filter)+'">'+esc(c)+'</button>';}).join('');
  }
  function grid(){
    var shown = courses.filter(function(c){return filter === 'All' || c.category === filter;});
    return '<p class="count" role="status">'+shown.length+(shown.length===1?' course':' courses')+(filter==='All'?'':' in '+esc(filter))+'</p><div class="grid">'+shown.map(card).join('')+'</div>';
  }
  function catalogue(){
    var hasSample = courses.some(function(c){return c.placeholder;});
    return '<section class="wrap page-head"><p class="eyebrow">Courses</p><h1>The course <em>catalogue</em>.</h1><p class="lead">Choose a category, read the programme and buy on Gumroad.</p></section>' +
      '<section class="sec" style="padding-top:0"><div class="wrap">' +
      (hasSample?'<p class="sample-note">The courses shown here are sample entries. Titles, prices, durations and purchase links will be replaced with real course information.</p>':'') +
      '<div class="chips" role="group" aria-label="Filter courses by category">'+chips()+'</div><div id="grid">'+grid()+'</div></div></section>';
  }

  function course(c){
    var url = safeUrl(c.gumroadUrl);
    var buy = url ? '<a class="btn lg" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Get the Course <span aria-hidden="true">&rarr;</span></a><p class="note">You complete your purchase on Gumroad.</p>' : '<span class="btn lg disabled" aria-disabled="true">Coming soon</span><p class="note">The purchase link has not been added yet.</p>';
    var related = courses.filter(function(x){return x.slug !== c.slug;}).slice(0,3);
    return '' +
    '<div class="wrap"><div class="c-head"><nav class="crumbs" aria-label="Breadcrumb"><a href="#home">Home</a><span aria-hidden="true">/</span><a href="#courses">Courses</a><span aria-hidden="true">/</span><span>'+esc(c.category)+'</span></nav>' +
      '<p class="meta"><span>'+esc(c.category)+'</span><span>'+esc(c.level)+'</span>'+(c.placeholder?'<span>Sample course</span>':'')+'</p>' +
      '<h1>'+esc(c.title)+'</h1><p class="lead" style="max-width:44rem">'+esc(c.short)+'</p></div>' +
      '<div class="art c-cover" data-tone="'+tone(c)+'">'+artInner(c.cover, c.slug+'-cover', c.title)+'</div>' +
      '<div class="c-layout">' +
        '<aside class="c-aside" aria-label="Purchase"><p class="price">'+money(c)+'</p>'+buy+
          '<dl><div><dt>Level</dt><dd>'+esc(c.level)+'</dd></div><div><dt>Duration</dt><dd>'+esc(c.duration)+'</dd></div><div><dt>Category</dt><dd>'+esc(c.category)+'</dd></div></dl></aside>' +
        '<div class="c-main">' +
          '<section class="c-sec prose"><h2>Introduction</h2><p>'+esc(c.intro)+'</p></section>' +
          '<section class="c-sec"><h2>What you will learn</h2>'+list(c.learn,'checks')+'</section>' +
          '<section class="c-sec"><h2>Course programme</h2><ol class="programme">'+c.programme.map(function(m,i){return '<li><span class="mod">Module '+(i+1)+'</span><div><h3>'+esc(m.title)+'</h3><p>'+esc(m.text)+'</p></div></li>';}).join('')+'</ol></section>' +
          '<section class="c-sec"><h2>Who is this course for?</h2>'+list(c.audience,'checks')+'</section>' +
          '<section class="c-sec"><h2>Format and materials</h2><div class="facts"><div><h3>Duration</h3><p>'+esc(c.duration)+'</p></div><div><h3>Learning format</h3><p>'+esc(c.format)+'</p></div><div><h3>Included materials</h3>'+list(c.materials)+'</div></div></section>' +
          '<section class="c-sec"><h2>Questions</h2>'+faq(c.faq)+'</section>' +
          '<section class="c-sec"><h2>Ready to begin?</h2><div style="max-width:340px;display:grid;gap:12px">'+buy+'</div></section>' +
        '</div></div></div>' +
      (related.length ? '<section class="sec alt"><div class="wrap"><div class="sh-row"><div class="sh"><p class="eyebrow">Continue learning</p><h2>More <em>courses</em>.</h2></div><a class="link" href="#courses">All courses</a></div><div class="grid">'+related.map(card).join('')+'</div></div></section>' : '');
  }

  function contact(){
    return '<section class="wrap page-head"><p class="eyebrow">Contact</p><h1>Say <em>hello</em>.</h1><p class="lead">Questions about a course or about TOTA? Write to us and we will reply.</p></section>' +
      '<section class="sec" style="padding-top:0"><div class="wrap contact">' +
        '<div style="display:grid;gap:28px"><div style="display:grid;gap:10px"><p class="eyebrow">Email</p><div class="copyrow"><code id="mail">'+esc(site.email)+'</code><button class="chip" type="button" data-copy="mail">Copy</button></div><p class="status" id="copystatus" role="status" aria-live="polite"></p></div>' +
        '<div style="display:grid;gap:12px"><p class="eyebrow">Follow</p><ul class="social">'+site.social.map(function(s){return '<li><a class="link" href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer">'+esc(s.label)+'</a></li>';}).join('')+'</ul></div></div>' +
        '<form class="form" data-form="contact" novalidate>' +
          '<div class="field"><label for="c-name">Name</label><input id="c-name" type="text" autocomplete="name" required></div>' +
          '<div class="field"><label for="c-email">Email</label><input id="c-email" type="email" autocomplete="email" required></div>' +
          '<div class="field"><label for="c-topic">Topic</label><select id="c-topic"><option>A question about a course</option><option>Partnership</option><option>Something else</option></select></div>' +
          '<div class="field"><label for="c-msg">Message</label><textarea id="c-msg" required></textarea></div>' +
          '<div><button class="btn" type="submit">Send message <span aria-hidden="true">&rarr;</span></button></div><p class="status" role="status" aria-live="polite"></p></form>' +
      '</div></section>';
  }

  function legal(kind){
    var t = kind === 'privacy' ? 'Privacy Policy' : 'Terms and Conditions';
    var pts = kind === 'privacy' ? ['What personal data the website collects (contact form, newsletter sign-up)','How that data is used and how long it is kept','Third parties involved, including Gumroad for purchases','How people can ask to see or delete their data','Contact details of the responsible person'] : ['Who operates the website and the courses','What a purchase includes and where it takes place (Gumroad)','Use of course materials and copyright','Refunds and how they are handled','Limits of liability and the educational nature of the content'];
    return '<section class="wrap legal"><p class="eyebrow">Legal</p><h1>'+t+'</h1><p class="sample-note" style="margin:0">This page is a placeholder. Replace it with your own text before launch and have it reviewed by a qualified professional.</p><p>It should cover at least:</p>'+list(pts)+'</section>';
  }

  function footer(){
    return '<div class="wrap foot"><div class="foot-brand"><span class="foot-tota">TOTA</span><span class="foot-name">The Art of Touch Academy</span><p>Knowledge, technique and the art of touch, taught with care.</p></div>' +
      '<div><h4>Explore</h4><ul><li><a href="#home">Home</a></li><li><a href="#about">About</a></li><li><a href="#courses">Courses</a></li><li><a href="#contact">Contact</a></li></ul></div>' +
      '<div><h4>Follow</h4><ul>'+site.social.map(function(s){return '<li><a href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer">'+esc(s.label)+'</a></li>';}).join('')+'</ul></div>' +
      '<div><h4>Contact</h4><ul><li>'+esc(site.email)+'</li><li><a href="#privacy">Privacy Policy</a></li><li><a href="#terms">Terms and Conditions</a></li></ul></div></div>' +
      '<div class="wrap foot-base"><span>&copy; '+new Date().getFullYear()+' The Art of Touch Academy</span><span>Courses are hosted on Gumroad.</span></div>';
  }

  /* SEO helpers */
  function setMeta(desc){
    var m = document.querySelector('meta[name="description"]');
    if(!m){m = document.createElement('meta'); m.name = 'description'; document.head.appendChild(m);}
    m.content = desc;
  }
  function setLd(obj){
    var old = document.getElementById('ld'); if(old) old.remove();
    if(!obj) return;
    var s = document.createElement('script'); s.type = 'application/ld+json'; s.id = 'ld'; s.textContent = JSON.stringify(obj); document.head.appendChild(s);
  }

  /* router: plain #name hashes only */
  var ROUTES = {
    home:{v:home,t:'The Art of Touch Academy',d:'TOTA, The Art of Touch Academy: online massage education with courses in relaxation, deep tissue, sports and facial massage and professional development.',n:'home'},
    about:{v:about,t:'About TOTA | The Art of Touch Academy',d:'More than a technique, an art. Learn about the philosophy, educational approach and mission of The Art of Touch Academy.',n:'about'},
    courses:{v:catalogue,t:'Massage Courses | The Art of Touch Academy',d:'Browse massage courses by category, level and price. Each course page lists the programme and materials before you buy on Gumroad.',n:'courses'},
    contact:{v:contact,t:'Contact | The Art of Touch Academy',d:'Contact The Art of Touch Academy with questions about courses.',n:'contact'},
    privacy:{v:function(){return legal('privacy');},t:'Privacy Policy | The Art of Touch Academy',d:'Privacy policy of The Art of Touch Academy.',n:''},
    terms:{v:function(){return legal('terms');},t:'Terms and Conditions | The Art of Touch Academy',d:'Terms and conditions of The Art of Touch Academy.',n:''}
  };
  function route(){
    var h = location.hash.replace(/^#/,'') || 'home', html, title, desc, nav, ld = null;
    if(h.indexOf('course-') === 0){
      var c = courses.filter(function(x){return 'course-'+x.slug === h;})[0];
      if(c){
        html = course(c); title = c.title+' | The Art of Touch Academy'; desc = c.short; nav = 'courses';
        ld = {'@context':'https://schema.org','@type':'Course',name:c.title,description:c.short,provider:{'@type':'Organization',name:site.name},offers:{'@type':'Offer',price:c.price,priceCurrency:c.currency||'EUR',url:safeUrl(c.gumroadUrl)||undefined}};
      }
    } else if(ROUTES[h]){
      html = ROUTES[h].v(); title = ROUTES[h].t; desc = ROUTES[h].d; nav = ROUTES[h].n;
    }
    if(!html){
      html = '<section class="wrap legal"><p class="eyebrow">404</p><h1>Page not found</h1><p>The page you are looking for does not exist.</p><div><a class="btn" href="#home">Back to home</a></div></section>';
      title = 'Page not found | The Art of Touch Academy'; desc = 'Page not found.'; nav = '';
    }
    main.innerHTML = html;
    document.title = title; setMeta(desc); setLd(ld);
    document.querySelectorAll('.nav a').forEach(function(a){if(a.dataset.r === nav) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');});
    closeMenu();
    window.scrollTo({top:0,behavior:'instant'});
    try{main.focus({preventScroll:true});}catch(e){}
  }

  /* menu */
  var btn = document.getElementById('menuBtn'), nav = document.getElementById('nav');
  function closeMenu(){nav.classList.remove('open'); btn.setAttribute('aria-expanded','false');}
  btn.addEventListener('click', function(){var o = nav.classList.toggle('open'); btn.setAttribute('aria-expanded', String(o));});
  document.getElementById('skip').addEventListener('click', function(){main.focus();});

  /* interactions */
  main.addEventListener('click', function(e){
    var f = e.target.closest('[data-filter]');
    if(f){
      filter = f.getAttribute('data-filter');
      document.querySelectorAll('.chip[data-filter]').forEach(function(b){b.setAttribute('aria-pressed', String(b.getAttribute('data-filter') === filter));});
      document.getElementById('grid').innerHTML = grid();
      return;
    }
    var cp = e.target.closest('[data-copy]');
    if(cp){
      var el = document.getElementById(cp.getAttribute('data-copy')), st = document.getElementById('copystatus');
      var sel = function(){var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); st.textContent = 'Address selected. Press copy on your keyboard.';};
      if(navigator.clipboard && navigator.clipboard.writeText){navigator.clipboard.writeText(el.textContent).then(function(){st.textContent = 'Email address copied.';}).catch(sel);} else {sel();}
    }
  });
  main.addEventListener('submit', function(e){
    var form = e.target.closest('form[data-form]'); if(!form) return;
    e.preventDefault();
    var st = form.querySelector('.status');
    if(!form.checkValidity()){st.textContent = 'Please complete the required fields with a valid email address.'; var bad = form.querySelector(':invalid'); if(bad) bad.focus(); return;}
    st.textContent = form.getAttribute('data-form') === 'newsletter' ? 'Sign-up is not active yet. Please check back soon.' : 'This form is not connected yet. Please write to us at '+site.email+'.';
  });

  document.getElementById('footer').innerHTML = footer();
  window.addEventListener('hashchange', route);
  route();
})();
</script>

</body>
</html>
